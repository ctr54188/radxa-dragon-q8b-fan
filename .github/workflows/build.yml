name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            cross: aarch64-linux-gnu-
          - arch: x86_64
            cross: ""
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain
        if: matrix.cross != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-${{ matrix.arch }}-linux-gnu

      - name: show configuration
        run: make info CROSS_COMPILE='${{ matrix.cross }}' STATIC=1

      - name: build static binary
        run: make CROSS_COMPILE='${{ matrix.cross }}' STATIC=1

      - name: rename + report
        run: |
          mv build/q8b-fan build/q8b-fan-${{ matrix.arch }}
          ls -l build/
          file build/q8b-fan-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: q8b-fan-${{ matrix.arch }}
          path: build/q8b-fan-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
